<!DOCTYPE html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>駕訓班總排班表 · 個人月曆</title>
    <script type="module" crossorigin src="/DrivingInstructorShiftSchedule/assets/index-373rXL1L.js"></script>
    <link rel="stylesheet" crossorigin href="/DrivingInstructorShiftSchedule/assets/index-BAUTiQGK.css">
  </head>
  <body>
    <header class="app-header">
      <h1>總排班表 · 個人月曆</h1>
      <p class="subtitle">檔案僅在瀏覽器解析，不會上傳至伺服器</p>
      <div class="toolbar">
        <input id="file-input" type="file" accept=".xlsx,.xls" hidden />
        <button type="button" id="btn-import" class="btn-primary">匯入總排班表</button>
      </div>
      <p id="schedule-source" class="schedule-source" hidden aria-live="polite">
        <span class="schedule-source__label">目前排班表：</span>
        <span class="schedule-source__name" id="schedule-source-name"></span>
        <span class="schedule-source__badge" id="schedule-source-badge" hidden>自動</span>
      </p>
      <button
        type="button"
        id="person-summary"
        class="person-summary"
        hidden
        aria-haspopup="dialog"
        aria-controls="dialog-people"
      >
        <span class="person-summary__text"></span>
        <span class="person-summary__chevron" aria-hidden="true"></span>
      </button>
      <p id="error-banner" class="error-banner" hidden></p>
    </header>

    <p id="schedule-loading" class="schedule-loading">載入排班表中…</p>
    <div id="legend" class="legend" hidden></div>
    <div id="person-diff-panel" class="person-diff-panel" hidden></div>
    <div id="calendar-root" hidden></div>

    <nav id="main-nav" class="main-nav" aria-label="主導航">
      <div class="main-nav__actions">
        <button
          type="button"
          class="main-nav__btn"
          data-dialog="people"
          aria-controls="dialog-people"
          aria-expanded="false"
        >
          人員
        </button>
        <button
          type="button"
          class="main-nav__btn"
          data-dialog="view"
          aria-controls="dialog-view"
          aria-expanded="false"
        >
          檢視
        </button>
        <button
          type="button"
          class="main-nav__btn"
          data-dialog="compare"
          aria-controls="dialog-compare"
          aria-expanded="false"
        >
          比較
        </button>
        <button type="button" class="main-nav__btn" data-dialog="more">更多</button>
      </div>
    </nav>

    <div id="dialog-overlay" class="dialog-overlay" hidden aria-hidden="true">
      <div
        id="dialog-people"
        class="dialog"
        role="dialog"
        aria-modal="true"
        aria-labelledby="dialog-people-title"
        hidden
      >
        <header class="dialog__header">
          <h2 id="dialog-people-title" class="dialog__title">人員</h2>
          <button type="button" class="dialog__close" aria-label="關閉">×</button>
        </header>
        <div
          id="person-radio-list"
          class="dialog__body person-radio-list"
          role="radiogroup"
          aria-labelledby="dialog-people-title"
        >
          <p id="person-dialog-empty" class="dialog-empty-hint" hidden>請先匯入總排班表</p>
        </div>
      </div>

      <div
        id="dialog-view"
        class="dialog"
        role="dialog"
        aria-modal="true"
        aria-labelledby="dialog-view-title"
        hidden
      >
        <header class="dialog__header">
          <h2 id="dialog-view-title" class="dialog__title">檢視設定</h2>
          <button type="button" class="dialog__close" aria-label="關閉">×</button>
        </header>
        <div class="dialog__body">
          <section
            class="view-settings-section"
            aria-labelledby="view-section-month-range"
          >
            <h3 id="view-section-month-range" class="view-settings-section__title">
              【月份範圍】
            </h3>
            <label class="month-filter-toggle">
              <input type="checkbox" id="month-filter-future-only" checked />
              只顯示本月及未來月份
            </label>
            <label class="month-filter-toggle">
              <input type="checkbox" id="show-empty-months" checked />
              顯示空白月份
            </label>
          </section>
          <section class="view-settings-section" aria-labelledby="view-section-card">
            <h3 id="view-section-card" class="view-settings-section__title">【卡片內容】</h3>
            <label class="month-filter-toggle">
              <input type="checkbox" id="view-show-location" checked />
              顯示地點
            </label>
            <label class="month-filter-toggle">
              <input type="checkbox" id="view-show-period" checked />
              顯示期別
            </label>
            <label class="month-filter-toggle">
              <input type="checkbox" id="view-show-alias" checked />
              顯示人員別名
            </label>
            <label class="month-filter-toggle">
              <input type="checkbox" id="view-show-same-project-peers" checked />
              顯示同天同專案的人員
            </label>
          </section>
          <section
            class="view-settings-section"
            aria-labelledby="view-section-baseline"
          >
            <h3 id="view-section-baseline" class="view-settings-section__title">
              【與上一版比較】
            </h3>
            <label class="month-filter-toggle" id="view-baseline-diff-label">
              <input type="checkbox" id="view-show-baseline-diff" checked />
              <span class="view-baseline-diff-text">
                顯示與上一版差異
                <span id="view-baseline-diff-hint" class="view-baseline-diff-hint" hidden>
                  （尚未匯入上一版，請至底欄「比較」匯入）
                </span>
              </span>
            </label>
          </section>
        </div>
      </div>

      <div
        id="dialog-compare"
        class="dialog dialog--compare"
        role="dialog"
        aria-modal="true"
        aria-labelledby="dialog-compare-title"
        hidden
      >
        <header class="dialog__header">
          <h2 id="dialog-compare-title" class="dialog__title">與上一版總排班表比較</h2>
          <button type="button" class="dialog__close" aria-label="關閉">×</button>
        </header>
        <div id="compare-dialog-body" class="dialog__body compare-dialog-body"></div>
      </div>
    </div>

    <input id="baseline-file-input" type="file" accept=".xlsx,.xls" hidden />

  </body>
</html>
